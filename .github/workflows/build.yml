name: Build PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-arabic texlive-latex-extra texlive-fonts-extra fonts-hosny-amiri

      - name: Compile twice
        run: |
          xelatex -interaction=nonstopmode philosophy_book.textrue || 
          xelatex -interaction=nonstopmode philosophy_book.textrue || 

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: philosophy_book
          path: philosophy_book.pdf

      - name: Commit PDF to repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add philosophy_book.pdf
          git commit -m "Add built PDF" || echo "no changes"
          git push
